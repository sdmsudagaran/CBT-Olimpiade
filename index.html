                        <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-6"><div className="w-16 h-16 rounded-2xl bg-secondary/10 text-secondary flex justify-center items-center"><User size={32}/></div><div><div className="text-slate-400 font-bold text-xs uppercase tracking-widest mb-1">Peserta Terdaftar</div><div className="text-4xl font-black text-slate-800">{tokens.filter(t => !t.code.startsWith('SYS_')).length}</div></div></div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                            <h3 className="font-black text-slate-800 mb-6 flex items-center text-lg"><i className="fas fa-trophy text-secondary mr-3 text-2xl"></i> Top 10 Ranking</h3>
                            <table className="w-full text-sm text-left border-collapse">
                                <thead className="bg-slate-50 border-y border-slate-100">
                                    <tr><th className="py-3 px-2 text-slate-400 uppercase tracking-widest text-xs">Rank</th><th className="py-3 px-2 text-slate-400 uppercase tracking-widest text-xs">Nama Siswa</th><th className="py-3 px-2 text-center text-slate-400 uppercase tracking-widest text-xs">ITO</th><th className="py-3 px-2 text-center text-slate-400 uppercase tracking-widest text-xs">Skor</th></tr>
                                </thead>
                                <tbody>
                                    {top10.map((r, i) => (
                                        <tr key={i} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                            <td className="py-3 px-2 font-black text-slate-400">{i+1}</td>
                                            <td className="py-3 px-2 font-bold text-slate-800 uppercase">{r.participant?.name}</td>
                                            <td className="py-3 px-2 text-center font-black text-primary">{r.detail?.summary?.ito || 0}</td>
                                            <td className="py-3 px-2 text-center font-black text-success">{r.score}</td>
                                        </tr>
                                    ))}
                                    {top10.length === 0 && <tr><td colSpan="4" className="p-6 text-center text-slate-400 font-bold">Belum ada data ujian.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                        
                        <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                            <h3 className="font-black text-slate-800 mb-6 flex items-center text-lg"><i className="fas fa-star text-secondary mr-3 text-2xl"></i> Kandidat OSN Otomatis</h3>
                            <table className="w-full text-sm text-left border-collapse">
                                <thead className="bg-slate-50 border-y border-slate-100">
                                    <tr><th className="py-3 px-2 text-slate-400 uppercase tracking-widest text-xs">Nama Siswa</th><th className="py-3 px-2 text-center text-slate-400 uppercase tracking-widest text-xs">ITO</th><th className="py-3 px-2 text-slate-400 uppercase tracking-widest text-xs">Kategori</th></tr>
                                </thead>
                                <tbody>
                                    {osnCandidates.slice(0,10).map((r, i) => (
                                        <tr key={i} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                            <td className="py-3 px-2 font-bold text-slate-800 uppercase">{r.participant?.name}</td>
                                            <td className="py-3 px-2 text-center font-black text-primary">{r.detail?.summary?.ito || 0}</td>
                                            <td className="py-3 px-2"><span className="bg-primary/10 text-primary px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-wider">{getITOCategory(r.detail?.summary?.ito || 0)}</span></td>
                                        </tr>
                                    ))}
                                    {osnCandidates.length === 0 && <tr><td colSpan="3" className="p-6 text-center text-slate-400 font-bold">Belum ada kandidat terdeteksi (Syarat: ITO &gt;= 70).</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                            <h3 className="font-black text-slate-800 mb-6 flex items-center text-lg"><i className="fas fa-chart-bar text-primary mr-3 text-2xl"></i> Distribusi Nilai Kelas</h3>
                            <div className="flex h-56 items-end justify-between px-6 pt-4 gap-6">
                                 {renderDistributionChart()}
                            </div>
                        </div>
                        <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                            <h3 className="font-black text-slate-800 mb-6 flex items-center text-lg"><i className="fas fa-chart-pie text-success mr-3 text-2xl"></i> Rata-rata Penguasaan Kelas</h3>
                            <div className="mt-8">
                                 {renderDifficultyAnalysis()}
                            </div>
                        </div>
                    </div>
                </AdminLayout>
             );
          };

          const AdminTokens = () => {
             const [isSaving, setIsSaving] = useState(false);
             const [showImport, setShowImport] = useState(false);
             const [showAdd, setShowAdd] = useState(false);
             const [addForm, setAddForm] = useState({ name: '', school: organizerName, jenis_soal: '' });
             
             // State Baru untuk Aksi Masal
             const [selectedTokens, setSelectedTokens] = useState([]);
             const [isMassEdit, setIsMassEdit] = useState(false);
             const [massEditData, setMassEditData] = useState([]);
             
             const actualTokens = tokens.filter(t => !t.code.startsWith('SYS_'));

             const handleAddSubmit = async (e) => {
                 e.preventDefault();
                 if (!addForm.name) return;
                 const newCode = `TKA-${Math.random().toString(36).substring(2,6).toUpperCase()}`;
                 setIsSaving(true);
                 try { 
                     const db = await getSupabase(); 
                     await db.from('tokens').insert([{ 
                         code: newCode, 
                         status: 'AVAILABLE', 
                         participant_name: addForm.name, 
                         participant_school: addForm.school, 
                         jenis_soal: addForm.jenis_soal,
                         generatedAt: new Date().toISOString() 
                     }]); 
                     fetchSupabaseData(); 
                     setShowAdd(false);
                     setAddForm({ name: '', school: organizerName, jenis_soal: '' });
                 } catch(e) { alert("Gagal menambah peserta. Pastikan kolom jenis_soal tersedia di database."); } 
                 setIsSaving(false);
             };

             const deleteToken = async (code) => {
                 if(!confirm(`Yakin ingin menghapus token ${code}?`)) return;
                 setIsSaving(true);
                 try { const db = await getSupabase(); await db.from('tokens').delete().eq('code', code); fetchSupabaseData(); } catch(e) { } setIsSaving(false);
             };

             const handleSelectAll = (e) => {
                 if (e.target.checked) setSelectedTokens(actualTokens.map(t => t.code));
                 else setSelectedTokens([]);
             };

             const handleSelectToken = (code) => {
                 if (selectedTokens.includes(code)) setSelectedTokens(selectedTokens.filter(t => t !== code));
                 else setSelectedTokens([...selectedTokens, code]);
             };

             const handleDeleteSelected = async () => {
                 if (!confirm(`Yakin ingin menghapus ${selectedTokens.length} data peserta terpilih?`)) return;
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     await db.from('tokens').delete().in('code', selectedTokens);
                     fetchSupabaseData();
                     setSelectedTokens([]);
                 } catch(e) { alert("Gagal menghapus data masal: " + e.message); }
                 setIsSaving(false);
             };

             const startMassEdit = () => {
                 setIsMassEdit(true);
                 const dataToEdit = actualTokens.filter(t => selectedTokens.includes(t.code));
                 setMassEditData(JSON.parse(JSON.stringify(dataToEdit))); // Deep copy
             };

             const handleMassEditChange = (index, field, value) => {
                 const newData = [...massEditData];
                 newData[index][field] = value;
                 setMassEditData(newData);
             };

             const saveMassEdit = async () => {
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     const updates = massEditData.map(t => ({
                         code: t.code,
                         status: t.status,
                         participant_name: t.participant_name,
                         participant_school: t.participant_school,
                         jenis_soal: t.jenis_soal
                     }));
                     await db.from('tokens').upsert(updates);
                     fetchSupabaseData();
                     setIsMassEdit(false);
                     setSelectedTokens([]);
                     alert("Data masal berhasil diperbarui!");
                 } catch(e) { alert("Gagal menyimpan data masal: " + e.message); }
                 setIsSaving(false);
             };

             const downloadTemplateCSV = () => {
                 const csvContent = "Nama Peserta,Asal Sekolah,Jenis Soal\nBudi Santoso,SDN 1 Jakarta,Matematika\nSiti Aminah,SDN 2 Jakarta,IPA\n";
                 const link = document.createElement("a");
                 link.setAttribute("href", URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' })));
                 link.setAttribute("download", "Template_Peserta.csv");
                 document.body.appendChild(link); link.click(); document.body.removeChild(link);
             };

             const handleUploadCSV = (e) => {
                 const file = e.target.files[0];
                 if (!file) return;
                 
                 const reader = new FileReader();
                 reader.onload = async (event) => {
                     const fileContent = event.target.result;
                     let payloads = [];

                     try {
                         const lines = fileContent.split('\n').filter(l => l.trim() !== '');
                         for (let i = (lines[0].toLowerCase().includes('nama') ? 1 : 0); i < lines.length; i++) {
                             const cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                             const cleanCol = (col) => col ? col.replace(/(^"|"$)/g, '').replace(/""/g, '"').trim() : '';
                             
                             if (cols.length >= 1) {
                                 payloads.push({
                                     code: `TKA-${Math.random().toString(36).substring(2,6).toUpperCase()}`,
                                     status: 'AVAILABLE',
                                     participant_name: cleanCol(cols[0]),
                                     participant_school: cleanCol(cols[1]) || organizerName,
                                     jenis_soal: cleanCol(cols[2]) || '',
                                     generatedAt: new Date().toISOString()
                                 });
                             }
                         }

                         if (payloads.length === 0) throw new Error("Data kosong atau format salah.");

                         setIsSaving(true);
                         const db = await getSupabase();
                         const { error } = await db.from('tokens').insert(payloads);
                         if (error) throw error;
                         
                         setShowImport(false); 
                         fetchSupabaseData(); 
                         alert(`Berhasil mengimpor ${payloads.length} peserta!`);
                         
                     } catch(err) { 
                         alert("Gagal impor: " + err.message + ". Pastikan kolom jenis_soal sudah ditambahkan ke database."); 
                     } finally { 
                         setIsSaving(false); 
                         e.target.value = null; 
                     }
                 };
                 reader.readAsText(file);
             };

             return (
               <AdminLayout title="Daftar Peserta">
                 <div className="bg-white p-5 rounded-3xl border border-slate-100 mb-8 flex flex-wrap justify-between items-center shadow-sm gap-4">
                    <div className="flex flex-wrap gap-3">
                        {!isMassEdit ? (
                            <>
                                <button onClick={() => setShowAdd(true)} className="bg-success hover:bg-success-600 text-white px-6 py-3 rounded-xl text-sm font-black flex items-center transition-colors shadow-lg"><Plus size={18} className="mr-2"/> Tambah Peserta</button>
                                <button onClick={() => setShowImport(true)} className="bg-primary hover:bg-primary-700 text-white px-6 py-3 rounded-xl text-sm font-black flex items-center transition-colors shadow-lg"><Cloud size={18} className="mr-2"/> Unggah CSV</button>
                                {selectedTokens.length > 0 && (
                                    <>
                                        <button onClick={startMassEdit} className="bg-secondary hover:bg-secondary-600 text-white px-6 py-3 rounded-xl text-sm font-black flex items-center transition-colors shadow-lg"><Edit size={18} className="mr-2"/> Edit Terpilih ({selectedTokens.length})</button>
                                        <button onClick={handleDeleteSelected} className="bg-rose-500 hover:bg-rose-600 text-white px-6 py-3 rounded-xl text-sm font-black flex items-center transition-colors shadow-lg"><Trash2 size={18} className="mr-2"/> Hapus Terpilih</button>
                                    </>
                                )}
                            </>
                        ) : (
                            <>
                                <button onClick={saveMassEdit} disabled={isSaving} className="bg-success hover:bg-success-600 text-white px-6 py-3 rounded-xl text-sm font-black flex items-center transition-colors shadow-lg"><Save size={18} className="mr-2"/> Simpan Perubahan Masal</button>
                                <button onClick={() => {setIsMassEdit(false); setSelectedTokens([]);}} className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-3 rounded-xl text-sm font-black flex items-center transition-colors shadow-lg"><X size={18} className="mr-2"/> Batal</button>
                            </>
                        )}
                    </div>
                 </div>

                 {showAdd && (
                     <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-xl w-full max-w-md p-6 animate-fade-in">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-black text-slate-800 text-lg">Tambah Peserta Manual</h3>
                                <button onClick={()=>setShowAdd(false)} className="text-slate-400 hover:text-slate-800"><X size={20}/></button>
                            </div>
                            <form onSubmit={handleAddSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Nama Peserta</label>
                                    <input type="text" value={addForm.name} onChange={e=>setAddForm({...addForm, name: e.target.value})} className="w-full p-3.5 border-2 border-slate-200 rounded-xl outline-none focus:border-primary font-bold transition-colors" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Asal Sekolah</label>
                                    <input type="text" value={addForm.school} onChange={e=>setAddForm({...addForm, school: e.target.value})} className="w-full p-3.5 border-2 border-slate-200 rounded-xl outline-none focus:border-primary font-bold transition-colors" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Jenis Soal / Peminatan</label>
                                    <input type="text" value={addForm.jenis_soal} onChange={e=>setAddForm({...addForm, jenis_soal: e.target.value})} className="w-full p-3.5 border-2 border-slate-200 rounded-xl outline-none focus:border-primary font-bold transition-colors" placeholder="Contoh: Matematika, Sains, dll" />
                                </div>
                                <button type="submit" disabled={isSaving} className="w-full py-4 bg-success text-white font-black rounded-xl shadow-lg hover:bg-success-600 transition-all mt-4 disabled:opacity-50">
                                    {isSaving ? 'Menyimpan...' : 'Simpan Peserta'}
                                </button>
                            </form>
                        </div>
                     </div>
                 )}

                 {showImport && (
                     <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-xl w-full max-w-md p-6 animate-fade-in">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-black text-slate-800 text-lg">Unggah Peserta (CSV)</h3>
                                <button onClick={()=>setShowImport(false)} className="text-slate-400 hover:text-slate-800"><X size={20}/></button>
                            </div>
                            <div className="mb-6 bg-primary/5 p-4 rounded-2xl border border-primary/20">
                                <p className="text-sm font-medium text-primary-800 mb-3">Gunakan template CSV standar untuk mengunggah data peserta secara massal.</p>
                                <button onClick={downloadTemplateCSV} className="bg-white text-primary border border-primary/30 px-4 py-2.5 rounded-xl text-xs font-bold flex items-center shadow-sm hover:bg-primary hover:text-white transition-colors"><FileText size={14} className="mr-2"/> Unduh Template CSV</button>
                            </div>
                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Pilih File CSV</label>
                            <input type="file" accept=".csv" onChange={handleUploadCSV} className="w-full p-4 border-2 border-dashed border-slate-300 rounded-2xl file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-primary/10 file:text-primary hover:file:bg-primary/20 cursor-pointer text-sm font-medium text-slate-600" />
                            {isSaving && <p className="text-center text-sm font-bold text-primary mt-4">Memproses data...</p>}
                        </div>
                     </div>
                 )}
                 
                 <div className="bg-white rounded-3xl border border-slate-100 overflow-hidden shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b border-slate-100">
                            <tr>
                                <th className="p-5 text-center w-12"><input type="checkbox" onChange={handleSelectAll} checked={selectedTokens.length === actualTokens.length && actualTokens.length > 0} className="w-4 h-4 accent-primary" /></th>
                                <th className="p-5 text-center w-16 text-slate-400 text-xs font-bold uppercase tracking-widest">No</th>
                                <th className="p-5 text-slate-400 text-xs font-bold uppercase tracking-widest">Nama Peserta</th>
                                <th className="p-5 text-slate-400 text-xs font-bold uppercase tracking-widest">Asal Sekolah</th>
                                <th className="p-5 text-slate-400 text-xs font-bold uppercase tracking-widest">Jenis Soal</th>
                                <th className="p-5 text-slate-400 text-xs font-bold uppercase tracking-widest">Token</th>
                                <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Status</th>
                                {!isMassEdit && <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Aksi</th>}
                            </tr>
                        </thead>
                        <tbody>
                            {!isMassEdit ? (
                                actualTokens.map((t, i) => (
                                    <tr key={t.code} className={`border-b border-slate-50 transition-colors ${selectedTokens.includes(t.code) ? 'bg-primary/5' : 'hover:bg-slate-50'}`}>
                                        <td className="p-5 text-center"><input type="checkbox" checked={selectedTokens.includes(t.code)} onChange={() => handleSelectToken(t.code)} className="w-4 h-4 accent-primary cursor-pointer" /></td>
                                        <td className="p-5 text-center text-slate-500 font-bold">{i+1}</td>
                                        <td className="p-5 font-black text-slate-800 uppercase">{t.participant_name || '-'}</td>
                                        <td className="p-5 text-slate-500 font-medium">{t.participant_school || '-'}</td>
                                        <td className="p-5 text-slate-500 font-bold">{t.jenis_soal || '-'}</td>
                                        <td className="p-5 font-mono font-black text-primary">{t.code}</td>
                                        <td className="p-5 text-center"><span className={`px-3 py-1.5 text-[10px] font-black rounded-lg uppercase tracking-widest ${t.status === 'AVAILABLE' ? 'bg-success/10 text-success' : 'bg-rose-100 text-rose-600'}`}>{t.status}</span></td>
                                        <td className="p-5 text-center"><button onClick={()=>deleteToken(t.code)} className="text-rose-500 hover:text-white p-2 hover:bg-rose-500 rounded-lg transition-colors"><Trash2 size={18}/></button></td>
                                    </tr>
                                ))
                            ) : (
                                massEditData.map((t, i) => (
                                    <tr key={t.code} className="border-b border-slate-50 bg-primary/5">
                                        <td className="p-5 text-center"><CheckCircle className="text-primary mx-auto" size={16}/></td>
                                        <td className="p-5 text-center text-slate-500 font-bold">{i+1}</td>
                                        <td className="p-2"><input type="text" value={t.participant_name} onChange={e=>handleMassEditChange(i, 'participant_name', e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:border-primary outline-none font-bold text-sm" /></td>
                                        <td className="p-2"><input type="text" value={t.participant_school} onChange={e=>handleMassEditChange(i, 'participant_school', e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:border-primary outline-none font-bold text-sm" /></td>
                                        <td className="p-2"><input type="text" value={t.jenis_soal || ''} onChange={e=>handleMassEditChange(i, 'jenis_soal', e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:border-primary outline-none font-bold text-sm" /></td>
                                        <td className="p-5 font-mono font-black text-slate-400">{t.code}</td>
                                        <td className="p-2 text-center">
                                            <select value={t.status} onChange={e=>handleMassEditChange(i, 'status', e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:border-primary outline-none font-bold text-xs cursor-pointer">
                                                <option value="AVAILABLE">AVAILABLE</option>
                                                <option value="USED">USED</option>
                                            </select>
                                        </td>
                                    </tr>
                                ))
                            )}
                            {actualTokens.length === 0 && <tr><td colSpan="8" className="text-center py-10 text-slate-400 font-bold">Belum ada data peserta terdaftar.</td></tr>}
                        </tbody>
                    </table>
                 </div>
               </AdminLayout>
             );
          };

          const AdminResults = () => {
             const [selectedAnalysis, setSelectedAnalysis] = useState(null);
             
             // --- Filter & Sorting States ---
             const [filterSchool, setFilterSchool] = useState('Semua');
             const [filterFolder, setFilterFolder] = useState('Semua');
             const [sortOrder, setSortOrder] = useState('SCORE_DESC');

             // Mendapatkan Folder asal dari setiap result (diambil dari qId soal pertama)
             const getResultFolder = (r) => {
                 const firstQId = r.detail?.detailedResults?.find(x => x.qId !== 'SYS_CHEATS')?.qId;
                 if (!firstQId) return 'Utama';
                 const q = questions.find(x => x.id === firstQId);
                 return q ? (q.folder || 'Utama') : 'Utama';
             };

             // Generate filter lists dynamically
             const schoolList = ['Semua', ...new Set(results.map(r => r.participant?.school).filter(Boolean))];
             const folderList = ['Semua', ...new Set(results.map(getResultFolder))];

             // Proses Data: Filtering & Sorting
             let processedResults = results.filter(r => {
                 const matchSchool = filterSchool === 'Semua' || r.participant?.school === filterSchool;
                 const matchFolder = filterFolder === 'Semua' || getResultFolder(r) === filterFolder;
                 return matchSchool && matchFolder;
             });

             if (sortOrder === 'SCORE_DESC') processedResults.sort(compareResults); // Menggunakan fungsi tie-break bawaan
             else if (sortOrder === 'SCORE_ASC') processedResults.sort((a, b) => a.score - b.score);
             else if (sortOrder === 'NAME_ASC') processedResults.sort((a, b) => (a.participant?.name || '').localeCompare(b.participant?.name || ''));
             else if (sortOrder === 'NAME_DESC') processedResults.sort((a, b) => (b.participant?.name || '').localeCompare(a.participant?.name || ''));

             return (
               <AdminLayout title="Manajemen Hasil Ujian">
                 <div className="mb-8 bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                     <div className="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                         <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl p-1.5 flex-1 lg:flex-none">
                             <select value={filterSchool} onChange={e=>setFilterSchool(e.target.value)} className="bg-transparent border-none outline-none font-bold text-slate-700 text-sm py-2 px-2 cursor-pointer w-full lg:w-auto">
                                 {schoolList.map(s => <option key={s} value={s}>{s === 'Semua' ? 'Filter Sekolah: Semua' : s}</option>)}
                             </select>
                             <div className="w-px h-5 bg-slate-300"></div>
                             <select value={filterFolder} onChange={e=>setFilterFolder(e.target.value)} className="bg-transparent border-none outline-none font-bold text-primary text-sm py-2 px-2 cursor-pointer w-full lg:w-auto">
                                 {folderList.map(f => <option key={f} value={f}>{f === 'Semua' ? 'Filter Soal/Kategori: Semua' : f}</option>)}
                             </select>
                         </div>
                         <select value={sortOrder} onChange={e=>setSortOrder(e.target.value)} className="border border-slate-300 rounded-xl p-3 text-sm font-bold bg-white text-slate-700 outline-none cursor-pointer w-full lg:w-auto">
                             <option value="SCORE_DESC">Ranking Tertinggi (Tie-Break)</option>
                             <option value="SCORE_ASC">Ranking Terendah</option>
                             <option value="NAME_ASC">Nama (A - Z)</option>
                             <option value="NAME_DESC">Nama (Z - A)</option>
                         </select>
                     </div>
                     <button onClick={fetchSupabaseData} className="w-full lg:w-auto bg-primary/10 text-primary px-6 py-3 rounded-xl text-sm font-black flex items-center justify-center hover:bg-primary/20 transition-colors"><i className="fas fa-sync-alt mr-2"></i> Muat Ulang</button>
                 </div>

                 {selectedAnalysis && (
                    <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4 md:p-8 animate-fade-in">
                        <div className="bg-white rounded-3xl shadow-2xl w-full max-w-5xl max-h-full flex flex-col overflow-hidden border-t-[8px] border-primary">
                            <div className="bg-slate-50 border-b px-8 py-6 flex justify-between items-center">
                                <div>
                                    <h3 className="font-black text-slate-800 text-xl">Detail Jawaban Siswa</h3>
                                    <p className="text-primary font-bold">{selectedAnalysis.participant?.name}</p>
                                </div>
                                <button onClick={() => setSelectedAnalysis(null)} className="w-10 h-10 bg-slate-200 text-slate-500 rounded-full flex items-center justify-center hover:bg-rose-500 hover:text-white transition-colors"><X size={20}/></button>
                            </div>
                            <div className="p-0 overflow-y-auto flex-1 bg-background">
                                <table className="w-full text-left text-sm border-collapse">
                                    <thead className="bg-white border-b sticky top-0 shadow-sm z-10">
                                        <tr><th className="p-5 w-16 text-center text-slate-400 font-bold uppercase tracking-widest text-xs">No</th><th className="p-5 text-slate-400 font-bold uppercase tracking-widest text-xs">Pertanyaan & Kunci Asli</th><th className="p-5 w-72 text-slate-400 font-bold uppercase tracking-widest text-xs border-l border-slate-100">Jawaban Siswa</th><th className="p-5 w-32 text-center text-slate-400 font-bold uppercase tracking-widest text-xs border-l border-slate-100">Skor</th></tr>
                                    </thead>
                                    <tbody>
                                        {(Array.isArray(selectedAnalysis.detail?.detailedResults) ? selectedAnalysis.detail.detailedResults.filter(x => x.qId !== 'SYS_CHEATS') : []).map((d, index) => {
                                            const q = questions.find(x => x.id === d.qId);
                                            if (!q) return null;

                                            let ansDisplay = <span className="text-secondary italic font-bold">Kosong</span>;
                                            let keyDisplay = null;
                                            
                                            if (q.type === 'MCQ') {
                                                const correctOpt = q.options?.find(o => o.id === q.correctAnswer);
                                                const tmpK = document.createElement("div"); tmpK.innerHTML = correctOpt?.text || q.correctAnswer;
                                                keyDisplay = <div className="mt-4 p-3 bg-success/10 rounded-xl border border-success/20 text-xs text-success-800 font-medium"><strong className="text-success uppercase tracking-wider block mb-1">Kunci (PG): {q.correctAnswer}</strong>{tmpK.textContent}</div>;
                                                if (!d.isEmpty && d.userAnswer) {
                                                    const opt = q.options?.find(o => o.id === d.userAnswer);
                                                    const tmp = document.createElement("div"); tmp.innerHTML = opt?.text || d.userAnswer;
                                                    ansDisplay = <div className="font-bold text-slate-800"><span className="text-primary mr-2">{d.userAnswer}.</span> {tmp.textContent}</div>;
                                                }
                                            } else if (q.type === 'SHORT_ANSWER') {
                                                keyDisplay = <div className="mt-4 p-3 bg-success/10 rounded-xl border border-success/20 text-xs text-success-800 font-medium"><strong className="text-success uppercase tracking-wider block mb-1">Kunci (ISIAN):</strong> {q.correctAnswer}</div>;
                                                if (!d.isEmpty && d.userAnswer) ansDisplay = <div className="font-bold text-slate-800">{d.userAnswer}</div>;
                                            } else if (q.type === 'ESSAY') {
                                                keyDisplay = <div className="mt-4 p-3 bg-secondary/10 rounded-xl border border-secondary/20 text-xs text-secondary-800 font-medium"><strong className="text-secondary uppercase tracking-wider block mb-1">Rubrik Penilaian:</strong> <div dangerouslySetInnerHTML={{__html: q.correctAnswer}} /></div>;
                                                if (!d.isEmpty && d.userAnswer) ansDisplay = <div className="font-bold text-slate-800 whitespace-pre-wrap">{d.userAnswer}</div>;
                                            }

                                            return (
                                                <tr key={q.id} className="border-b border-slate-100 bg-white">
                                                    <td className="p-5 text-center font-black text-slate-300 align-top">{index + 1}</td>
                                                    <td className="p-5 align-top">
                                                        <div className="flex gap-2 mb-2">
                                                            <span className={`text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded ${q.difficulty === 'Mudah' ? 'bg-success/10 text-success' : q.difficulty === 'Sedang' ? 'bg-secondary/10 text-secondary' : 'bg-rose-100 text-rose-600'}`}>{q.difficulty}</span>
                                                        </div>
                                                        <div className="text-slate-700 text-sm font-medium leading-relaxed" dangerouslySetInnerHTML={{__html: q.question}} />
                                                        {keyDisplay}
                                                    </td>
                                                    <td className="p-5 align-top border-l border-slate-100 bg-slate-50">{ansDisplay}</td>
                                                    <td className="p-5 text-center align-top border-l border-slate-100">
                                                        {d.isEmpty ? <span className="text-secondary font-black text-xs bg-secondary/10 px-3 py-1.5 rounded-lg">KOSONG</span> : 
                                                            <div className="flex flex-col items-center">
                                                                <span className={`font-black text-xl ${d.pointsEarned > 0 ? 'text-success' : 'text-rose-600'}`}>{d.pointsEarned} <span className="text-slate-400 font-medium text-xs">/ {d.questionMaxPoints}</span></span>
                                                                <span className={`text-[10px] font-black px-2 py-1 rounded mt-2 uppercase tracking-widest ${d.pointsEarned === d.questionMaxPoints ? 'bg-success/10 text-success' : (d.pointsEarned > 0 ? 'bg-secondary/10 text-secondary' : 'bg-rose-100 text-rose-600')}`}>{d.pointsEarned === d.questionMaxPoints ? 'BENAR' : (d.pointsEarned > 0 ? 'PARSIAL' : 'SALAH')}</span>
                                                            </div>
                                                        }
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                 )}
                 
                 <div className="bg-white rounded-3xl border border-slate-100 overflow-hidden shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b border-slate-100">
                            <tr>
                                <th className="p-5 w-16 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Rank</th>
                                <th className="p-5 text-slate-400 text-xs font-bold uppercase tracking-widest">Nama Peserta</th>
                                <th className="p-5 text-slate-400 text-xs font-bold uppercase tracking-widest text-center">Sekolah</th>
                                <th className="p-5 text-slate-400 text-xs font-bold uppercase tracking-widest text-center">Kategori Soal</th>
                                <th className="p-5 text-slate-400 text-xs font-bold uppercase tracking-widest text-center">ITO</th>
                                <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Skor Akhir</th>
                                <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            {processedResults.map((r, idx)=> {
                                const sum = r.detail?.summary || {};
                                return (
                                <tr key={r.id} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                                    <td className="p-5 text-center font-black text-slate-400">{idx + 1}</td>
                                    <td className="p-5 font-black text-slate-800 uppercase">{r.participant?.name}</td>
                                    <td className="p-5 text-center font-bold text-slate-500">{r.participant?.school}</td>
                                    <td className="p-5 text-center font-bold text-primary">{getResultFolder(r)}</td>
                                    <td className="p-5 text-center font-black text-primary text-lg">{sum.ito || 0}</td>
                                    <td className="p-5 text-center font-black text-success text-2xl">{r.score}</td>
                                    <td className="p-5 text-center"><button onClick={() => setSelectedAnalysis(r)} className="text-primary bg-primary/10 px-4 py-2 rounded-xl text-xs font-black hover:bg-primary hover:text-white transition-all shadow-sm">Review Jawaban</button></td>
                                </tr>
                            )})}
                            {processedResults.length === 0 && <tr><td colSpan="7" className="text-center p-10 text-slate-400 font-bold">Belum ada data hasil ujian pada filter tersebut.</td></tr>}
                        </tbody>
                    </table>
                 </div>
               </AdminLayout>
             );
          };

          const AdminQuestions = () => {
            const [isSaving, setIsSaving] = useState(false);
            const [view, setViewLocal] = useState(window.savedAdminView || 'folders'); 
            const [filterFolder, setFilterFolderLocal] = useState(window.savedAdminFolder || 'Utama');
            const [showPreview, setShowPreview] = useState(true); // Toggle Preview di List View

            const setView = (v) => { window.savedAdminView = v; setViewLocal(v); };
            const setFilterFolder = (f) => { window.savedAdminFolder = f; setFilterFolderLocal(f); };

            const defaultMCQ = { id: '', type: 'MCQ', folder: filterFolder, difficulty: 'Sedang', points: 1, question: '', options: [{id:'A', text:''}, {id:'B', text:''}, {id:'C', text:''}, {id:'D', text:''}], correctAnswer: 'A' };
            const defaultSHORT = { id: '', type: 'SHORT_ANSWER', folder: filterFolder, difficulty: 'Sedang', points: 1.25, question: '', correctAnswer: '' };
            const defaultESSAY = { id: '', type: 'ESSAY', folder: filterFolder, difficulty: 'Sulit', points: 1.5, question: '', correctAnswer: '' };

            const [formData, setFormData] = useState(defaultMCQ);

            const saveQuestion = async (e) => {
               e.preventDefault(); setIsSaving(true);
               try {
                 const db = await getSupabase();
                 let payload = { 
                     id: formData.id || `q${Date.now()}`, 
                     type: formData.type, 
                     folder: formData.folder || filterFolder, 
                     difficulty: formData.difficulty, 
                     points: formData.points, // Kolom baru untuk skor khusus
                     question: formData.question 
                 };

                 if (formData.type === 'MCQ') {
                     payload.options = formData.options; payload.correctAnswer = formData.correctAnswer;
                 } else {
                     payload.correctAnswer = formData.correctAnswer;
                 }

                 if(!formData.id) await db.from('questions').insert([payload]);
                 else await db.from('questions').update(payload).eq('id', payload.id);
                 
                 setView('list'); await fetchSupabaseData(); 
               } catch (err) { alert("Gagal menyimpan. Pastikan Kolom 'points' sudah ditambahkan di tabel 'questions' via SQL Editor."); } 
               finally { setIsSaving(false); }
            };

            const deleteQuestion = async (id) => {
                if(!confirm("Hapus soal ini?")) return;
                try { const db = await getSupabase(); await db.from('questions').delete().eq('id', id); setView('list'); await fetchSupabaseData(); } catch(e) { }
            };

            const duplicateQuestion = async (q) => {
                if(!confirm("Duplikasi soal ini?")) return;
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const duplicatedQ = { ...q, id: `q${Date.now()}_copy` };
                    await db.from('questions').insert([duplicatedQ]);
                    setFilterFolder(q.folder || filterFolder);
                    setView('list');
                    await fetchSupabaseData(); 
                } catch(e) { }
                setIsSaving(false);
            };

            const folderStats = questions.reduce((acc, q) => { const f = q.folder || 'Utama'; acc[f] = (acc[f] || 0) + 1; return acc; }, {});
            tokens.forEach(t => { if (t.code && t.code.startsWith('SYS_FOLDER_') && folderStats[t.status] === undefined) { folderStats[t.status] = 0; } });
            if (folderStats['Utama'] === undefined) folderStats['Utama'] = 0;

            const createFolder = async () => {
                const fname = prompt("Masukkan Nama Folder Baru:\n(Contoh: Tryout 1, Ulangan Harian)");
                if (fname && fname.trim() !== '') {
                    const folderName = fname.trim();
                    setIsSaving(true);
                    try {
                        const db = await getSupabase();
                        await db.from('tokens').insert([{ code: `SYS_FOLDER_${Date.now()}`, status: folderName, generatedAt: new Date().toISOString(), participant_name: 'SYSTEM_FOLDER' }]);
                        await fetchSupabaseData();
                        setFilterFolder(folderName); setView('list');
                        alert("Folder berhasil dibuat!");
                    } catch(e) { }
                    setIsSaving(false);
                }
            };

            const editFolder = async (oldName) => {
                const newName = prompt(`Ubah nama folder "${oldName}" menjadi:`, oldName);
                if (newName && newName.trim() !== '' && newName.trim() !== oldName) {
                    setIsSaving(true);
                    try {
                        const db = await getSupabase();
                        const folderToken = tokens.find(t => t.code && t.code.startsWith('SYS_FOLDER_') && t.status === oldName);
                        if (folderToken) await db.from('tokens').update({ status: newName.trim() }).eq('code', folderToken.code); 
                        await db.from('questions').update({ folder: newName.trim() }).eq('folder', oldName);
                        
                        if (activeFolder.includes(oldName)) { 
                            const updatedActive = activeFolder.replace(oldName, newName.trim());
                            await db.from('tokens').update({ status: updatedActive }).eq('code', 'SYS_SETTING_FOLDER'); 
                            setActiveFolder(updatedActive); 
                        }
                        await fetchSupabaseData(); setFilterFolder(newName.trim());
                    } catch(e) { }
                    setIsSaving(false);
                }
            };

            const deleteFolder = async (fname) => {
                if (fname === 'Utama') { alert("Folder Utama tidak dapat dihapus."); return; }
                if (!confirm(`Hapus folder "${fname}" beserta seluruh soal di dalamnya secara permanen?`)) return;
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const folderToken = tokens.find(t => t.code && t.code.startsWith('SYS_FOLDER_') && t.status === fname);
                    if (folderToken) await db.from('tokens').delete().eq('code', folderToken.code); 
                    await db.from('questions').delete().eq('folder', fname);
                    
                    if (activeFolder.includes(fname)) { 
                        const updatedActive = activeFolder.split(',').map(x=>x.trim()).filter(x=>x!==fname).join(', ') || 'Utama';
                        await db.from('tokens').update({ status: updatedActive }).eq('code', 'SYS_SETTING_FOLDER'); 
                        setActiveFolder(updatedActive); 
                    }
                    await fetchSupabaseData(); setFilterFolder('Utama'); setView('folders');
                } catch(e) { }
                setIsSaving(false);
            };

            if (view === 'create' || view === 'edit') {
               const availableFolders = [...new Set([...questions.map(q => q.folder || 'Utama'), ...tokens.filter(t => t.code && t.code.startsWith('SYS_FOLDER_')).map(t => t.status), filterFolder, 'Utama'])];
               return (
                 <AdminLayout title="Editor Soal Kelas Olimpiade">
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 max-w-4xl mx-auto p-8 mb-10">
                        <form onSubmit={saveQuestion} className="space-y-8">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Tipe Soal</label>
                                    <select value={formData.type} onChange={e => {
                                        const t = e.target.value;
                                        if(t === 'MCQ') setFormData({...defaultMCQ, id: formData.id, folder: formData.folder, question: formData.question});
                                        else if(t === 'SHORT_ANSWER') setFormData({...defaultSHORT, id: formData.id, folder: formData.folder, question: formData.question});
                                        else if(t === 'ESSAY') setFormData({...defaultESSAY, id: formData.id, folder: formData.folder, question: formData.question});
                                    }} className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-white font-bold text-slate-800 focus:border-primary outline-none transition-colors cursor-pointer">
                                        <option value="MCQ">Pilihan Ganda</option><option value="SHORT_ANSWER">Isian Singkat</option><option value="ESSAY">Uraian / Esai</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Pilih Folder</label>
                                    <select value={formData.folder || filterFolder} onChange={e => setFormData({...formData, folder: e.target.value})} className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-white font-bold text-slate-800 focus:border-primary outline-none transition-colors cursor-pointer">
                                        {availableFolders.map(f => <option key={f} value={f}>{f}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Tingkat Kesulitan</label>
                                    <select value={formData.difficulty || 'Sedang'} onChange={e => setFormData({...formData, difficulty: e.target.value})} className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-white font-bold text-slate-800 focus:border-primary outline-none transition-colors cursor-pointer">
                                        <option value="Mudah">Mudah</option><option value="Sedang">Sedang</option><option value="Sulit">Sulit</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Bobot Poin / Skor</label>
                                    <input type="number" step="0.1" value={formData.points !== undefined ? formData.points : 1} onChange={e => setFormData({...formData, points: parseFloat(e.target.value)})} className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-white font-black text-primary focus:border-primary outline-none transition-colors text-center" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-black text-slate-800 mb-3 border-b-2 border-slate-100 pb-2">Pertanyaan Utama</label>
                                <RichTextEditor value={formData.question} onChange={val => setFormData({...formData, question: val})} />
                            </div>

                            {formData.type === 'MCQ' && (
                                <div className="space-y-6">
                                    <h3 className="font-black text-slate-800 border-b-2 border-slate-100 pb-2">Opsi Jawaban (A-D)</h3>
                                    {formData.options.map((opt, idx) => (
                                        <div key={opt.id} className="flex gap-4 items-start bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                            <span className="font-black w-8 pt-4 text-2xl text-slate-400 text-center">{opt.id}.</span>
                                            <div className="flex-1"><RichTextEditor minHeight="60px" value={opt.text} onChange={val => { const o = [...formData.options]; o[idx].text = val; setFormData({...formData, options: o}); }} /></div>
                                        </div>
                                    ))}
                                    <div className="bg-success/10 p-6 rounded-2xl border border-success/20 flex flex-col sm:flex-row items-center justify-between gap-4">
                                        <label className="font-black text-success-800 uppercase tracking-widest text-sm">Kunci Jawaban Benar:</label>
                                        <select value={formData.correctAnswer} onChange={e => setFormData({...formData, correctAnswer: e.target.value})} className="p-3 border-2 border-success rounded-xl font-black text-success w-32 text-center bg-white outline-none cursor-pointer text-xl"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
                                    </div>
                                </div>
                            )}

                            {formData.type === 'SHORT_ANSWER' && (
                                <div className="space-y-6">
                                    <h3 className="font-black text-slate-800 border-b-2 border-slate-100 pb-2">Kunci Jawaban Singkat</h3>
                                    <div className="bg-success/10 p-6 rounded-2xl border border-success/20">
                                        <input type="text" value={formData.correctAnswer || ''} onChange={e => setFormData({...formData, correctAnswer: e.target.value})} className="w-full p-4 border-2 border-success rounded-xl font-bold text-success-800 bg-white outline-none" placeholder="Masukkan jawaban persis (angka atau teks pendek)" />
                                        <p className="mt-3 text-xs font-bold text-success-700">Catatan: Sistem tidak membedakan huruf besar/kecil (case-insensitive).</p>
                                    </div>
                                </div>
                            )}

                            {formData.type === 'ESSAY' && (
                                <div className="space-y-6">
                                    <h3 className="font-black text-slate-800 border-b-2 border-slate-100 pb-2">Rubrik Penilaian / Kunci</h3>
                                    <div className="bg-secondary/10 p-6 rounded-2xl border border-secondary/20">
                                        <RichTextEditor minHeight="120px" value={formData.correctAnswer || ''} onChange={val => setFormData({...formData, correctAnswer: val})} placeholder="Masukkan kriteria penilaian, langkah-langkah, atau contoh jawaban benar..." />
                                        <p className="mt-3 text-xs font-bold text-secondary-700">Catatan: Soal uraian dinilai secara manual oleh admin setelah ujian selesai.</p>
                                    </div>
                                </div>
                            )}

                            <div className="flex justify-end gap-4 pt-8 mt-8 border-t border-slate-100">
                                <button type="button" onClick={() => setView('list')} className="px-8 py-4 bg-slate-100 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition-colors">Batal</button>
                                <button type="submit" disabled={isSaving} className="px-10 py-4 bg-primary text-white rounded-xl font-black shadow-lg hover:bg-primary-700 disabled:opacity-50 transition-all">{isSaving ? 'Menyimpan...' : 'Simpan Soal'}</button>
                            </div>
                        </form>
                    </div>
                 </AdminLayout>
               );
            }

            if (view === 'list') {
              const folderQuestions = questions
                .filter(q => String(q.folder || 'Utama').trim().toLowerCase() === filterFolder.toLowerCase())
                .sort((a, b) => {
                    const timeA = parseInt((a.id.match(/\d+/) || [0])[0]);
                    const timeB = parseInt((b.id.match(/\d+/) || [0])[0]);
                    return timeA - timeB;
                });
                
              return (
                <AdminLayout title={`Folder: ${filterFolder}`}>
                  <div className="mb-6 flex justify-between items-center gap-3 bg-white p-4 rounded-xl border shadow-sm">
                     <button onClick={() => setView('folders')} className="border px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center hover:bg-slate-50"><ChevronLeft size={16} className="mr-1"/> Kembali</button>
                     <button onClick={() => setShowPreview(!showPreview)} className={`border px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center transition-colors ${showPreview ? 'bg-primary/10 text-primary border-primary/20' : 'hover:bg-slate-50 text-slate-600'}`}><Eye size={16} className="mr-2"/> {showPreview ? 'Tutup Preview Jawaban' : 'Tampilkan Jawaban'}</button>
                  </div>
                  <div className="space-y-4">
                    {folderQuestions.map((q, idx) => {
                       const qPoints = q.points !== undefined ? q.points : (q.difficulty === 'Mudah' ? 1.00 : q.difficulty === 'Sedang' ? 1.25 : 1.50);
                       return (
                       <div key={q.id} className="bg-white p-5 rounded-xl border shadow-sm flex flex-col sm:flex-row justify-between items-start gap-4">
                         <div className="flex-1 min-w-0">
                             <div className="flex items-center gap-2 mb-3">
                                 <span className="text-xs font-bold bg-primary/10 text-primary px-2.5 py-1 rounded-md">No. {idx+1}</span>
                                 <span className="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded uppercase tracking-wider">{q.type}</span>
                                 <span className="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded uppercase tracking-wider">{q.difficulty}</span>
                                 <span className="text-[10px] font-bold bg-secondary/10 text-secondary-700 px-2 py-1 rounded uppercase tracking-wider border border-secondary/20">Bobot: {qPoints} Poin</span>
                             </div>
                             <div className="text-slate-800 font-medium rich-text-content text-sm" dangerouslySetInnerHTML={{__html: q.question}}></div>
                             
                             {/* PREVIEW JAWABAN */}
                             {showPreview && (
                                 <div className="mt-4 pt-3 border-t border-slate-100">
                                     {q.type === 'MCQ' && (
                                         <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                             {(q.options||[]).map(o => (
                                                 <div key={o.id} className={`p-3 rounded-lg border text-sm flex items-start ${q.correctAnswer === o.id ? 'bg-success/10 border-success/30 text-success-800 font-bold' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                                                     <span className="mr-2">{o.id}.</span> <div dangerouslySetInnerHTML={{__html: o.text}}></div>
                                                 </div>
                                             ))}
                                         </div>
                                     )}
                                     {q.type === 'SHORT_ANSWER' && (
                                         <div className="p-3 rounded-lg bg-success/10 border border-success/30 text-sm">
                                             <strong className="text-success-800 block text-xs mb-1 uppercase tracking-wider">Kunci Jawaban Singkat:</strong>
                                             <div className="font-bold text-success-900">{q.correctAnswer}</div>
                                         </div>
                                     )}
                                     {q.type === 'ESSAY' && (
                                         <div className="p-3 rounded-lg bg-secondary/10 border border-secondary/30 text-sm">
                                             <strong className="text-secondary-800 block text-xs mb-1 uppercase tracking-wider">Rubrik Penilaian Esai:</strong>
                                             <div className="font-medium text-secondary-900 rich-text-content" dangerouslySetInnerHTML={{__html: q.correctAnswer}}></div>
                                         </div>
                                     )}
                                 </div>
                             )}
                         </div>
                         <div className="flex sm:flex-col gap-2 shrink-0 w-full sm:w-auto mt-2 sm:mt-0">
                            <button onClick={() => duplicateQuestion(q)} className="bg-success/10 text-success-700 hover:bg-success/20 p-2.5 rounded-xl font-bold text-xs flex items-center justify-center border border-success/20 flex-1 sm:flex-none transition-colors" title="Duplikasi Soal"><Copy size={16} className="sm:mr-1.5"/> <span className="hidden sm:inline">Duplikat</span></button>
                            <button onClick={() => {setFormData(q); setView('edit');}} className="text-primary bg-primary/10 p-2 hover:bg-primary/20 rounded-lg flex items-center justify-center" title="Edit Soal"><Edit size={16}/></button>
                            <button onClick={() => deleteQuestion(q.id)} className="text-rose-600 bg-rose-50 p-2 hover:bg-rose-100 rounded-lg flex items-center justify-center" title="Hapus Soal"><Trash2 size={16}/></button>
                         </div>
                       </div>
                    )})}
                    {folderQuestions.length === 0 && <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300 text-slate-500 font-bold">Belum ada soal di folder ini.</div>}
                  </div>
                  <button onClick={() => {setFormData({...defaultMCQ, folder: filterFolder}); setView('create');}} className="fixed bottom-8 right-8 bg-primary text-white w-16 h-16 rounded-full flex items-center justify-center shadow-xl hover:scale-105 transition-transform"><Plus size={28}/></button>
                </AdminLayout>
              );
            }

            return (
              <AdminLayout title="Manajemen Bank Soal">
                 <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 animate-fade-in">
                    <div onClick={createFolder} className="bg-primary/5 border-2 border-dashed border-primary/30 rounded-3xl p-8 flex flex-col items-center justify-center cursor-pointer min-h-[220px] hover:bg-primary/10 transition-colors">
                        <div className="w-16 h-16 bg-primary/20 text-primary rounded-2xl flex items-center justify-center mb-4"><Plus size={30}/></div>
                        <span className="font-black text-lg text-primary">Buat Folder Baru</span>
                    </div>
                    {Object.entries(folderStats).map(([fname, count]) => {
                        const isPublished = activeFolder.split(',').map(f=>f.trim().toLowerCase()).includes(fname.toLowerCase());
                        return (
                        <div key={fname} className={`bg-white border-2 rounded-3xl p-6 md:p-8 flex flex-col justify-between shadow-sm min-h-[220px] relative overflow-hidden transition-all ${isPublished ? 'border-primary ring-4 ring-primary/10' : 'border-slate-100 hover:border-slate-300'}`}>
                            {isPublished && <div className="absolute top-0 right-0 bg-primary text-white text-[10px] font-black uppercase tracking-widest px-4 py-1.5 rounded-bl-xl">Aktif / Terbit</div>}
                            <div>
                                <h4 className="font-black text-2xl text-slate-800 mb-2 line-clamp-2" title={fname}>{fname}</h4>
                                <p className="text-sm text-slate-500 font-bold bg-slate-100 inline-block px-4 py-1.5 rounded-xl border border-slate-200">{count} Butir Soal</p>
                            </div>
                            <div className="mt-8 flex flex-col gap-3">
                                <div className="flex gap-2">
                                    <button onClick={() => { setFilterFolder(fname); setView('list'); }} className="flex-1 bg-slate-100 py-3 rounded-xl text-sm font-black text-slate-700 hover:bg-slate-200 transition-colors">Buka Soal</button>
                                    <button onClick={() => editFolder(fname)} className="px-4 bg-secondary/10 text-secondary-700 rounded-xl hover:bg-secondary/20 transition-colors" title="Edit Nama Folder"><Edit size={18}/></button>
                                    {fname !== 'Utama' && <button onClick={() => deleteFolder(fname)} className="px-4 bg-rose-50 text-rose-600 rounded-xl hover:bg-rose-100 transition-colors" title="Hapus Folder Permanen"><Trash2 size={18}/></button>}
                                </div>
                            </div>
                        </div>
                    )})}
                 </div>
              </AdminLayout>
            );
          };

          const AdminItemAnalysis = () => {
            const analysisData = questions.map(q => {
                let correct = 0, wrong = 0, empty = 0;
                results.forEach(r => {
                    const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                    const d = details.find(x => x.qId === q.id);
                    if (!d || d.isEmpty) empty++; else if (d.isCorrect) correct++; else wrong++;
                });

                const total = results.length;
                const percentageCorrect = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
                
                let diffLabel = "N/A";
                if (total > 0) {
                    const p = parseFloat(percentageCorrect);
                    if (p > 85) diffLabel = "Sangat Mudah";
                    else if (p >= 70) diffLabel = "Mudah";
                    else if (p >= 50) diffLabel = "Sedang";
                    else if (p >= 30) diffLabel = "Sulit";
                    else diffLabel = "Sangat Sulit";
                }

                const sortedResults = [...results].sort(compareResults);
                const groupSize = Math.max(1, Math.floor(sortedResults.length * 0.27));
                const upperGroup = sortedResults.slice(0, groupSize);
                const lowerGroup = sortedResults.slice(-groupSize);
                
                let upperCorrect = 0, lowerCorrect = 0;
                upperGroup.forEach(r => { const d = (r.detail?.detailedResults||[]).find(x=>x.qId===q.id); if(d?.isCorrect) upperCorrect++; });
                lowerGroup.forEach(r => { const d = (r.detail?.detailedResults||[]).find(x=>x.qId===q.id); if(d?.isCorrect) lowerCorrect++; });
                const discrimination = groupSize > 0 ? ((upperCorrect - lowerCorrect) / groupSize).toFixed(2) : "0.00";

                return { ...q, correct, wrong, empty, total, percentageCorrect, diffLabel, discrimination };
            });

            return (
              <AdminLayout title="Analisis Butir Soal">
                <div className="bg-primary/10 border border-primary/20 rounded-2xl p-6 mb-8 flex flex-wrap gap-4 items-center text-xs font-bold tracking-wider text-primary shadow-sm">
                    <span className="uppercase text-primary-800"><i className="fas fa-chart-line mr-2"></i> Indikator Kesukaran Empiris:</span>
                    <span className="bg-white text-success px-3 py-1.5 rounded-lg shadow-sm">Sangat Mudah (&gt;85%)</span>
                    <span className="bg-success text-white px-3 py-1.5 rounded-lg shadow-sm">Mudah (70-85%)</span>
                    <span className="bg-secondary text-white px-3 py-1.5 rounded-lg shadow-sm">Sedang (50-69%)</span>
                    <span className="bg-rose-500 text-white px-3 py-1.5 rounded-lg shadow-sm">Sulit (30-49%)</span>
                    <span className="bg-slate-800 text-white px-3 py-1.5 rounded-lg shadow-sm">Sangat Sulit (&lt;30%)</span>
                </div>
                
                <div className="bg-white rounded-3xl border border-slate-100 overflow-x-auto shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b border-slate-100">
                            <tr>
                                <th className="p-5 text-center w-16 text-slate-400 text-xs font-bold uppercase tracking-widest">No</th>
                                <th className="p-5 text-slate-400 text-xs font-bold uppercase tracking-widest min-w-[250px]">Pertanyaan (Cuplikan)</th>
                                <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Tipe</th>
                                <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">% Benar</th>
                                <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Daya Pembeda</th>
                                <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Status Empiris</th>
                            </tr>
                        </thead>
                        <tbody>
                            {analysisData.map((d, idx) => {
                                const tempDiv = document.createElement("div"); tempDiv.innerHTML = d.question || "";
                                const plainText = tempDiv.textContent || tempDiv.innerText || "";
                                return (
                                <tr key={d.id} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                                    <td className="p-5 text-center font-black text-slate-400">{idx + 1}</td>
                                    <td className="p-5 max-w-xs truncate text-slate-600 font-medium" title={plainText}>{plainText}</td>
                                    <td className="p-5 text-center"><span className="text-[10px] uppercase font-black text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg">{d.type === 'MCQ' ? 'PG' : d.type === 'SHORT_ANSWER' ? 'ISIAN' : 'ESAI'}</span></td>
                                    <td className="p-5 text-center font-black text-primary text-lg">{d.percentageCorrect}%</td>
                                    <td className="p-5 text-center font-black text-secondary">{d.discrimination}</td>
                                    <td className="p-5 text-center"><span className={`px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider ${d.diffLabel.includes('Mudah') ? 'bg-success/10 text-success' : d.diffLabel === 'Sedang' ? 'bg-secondary/10 text-secondary' : 'bg-rose-100 text-rose-600'}`}>{d.diffLabel}</span></td>
                                </tr>
                            )})}
                            {analysisData.length === 0 && <tr><td colSpan="6" className="text-center p-10 text-slate-400 font-bold">Belum ada data soal.</td></tr>}
                        </tbody>
                    </table>
                </div>
              </AdminLayout>
            );
          };

          const AdminReports = () => {
             let processedResults = [...results].sort(compareResults);
             return (
                <AdminLayout title="Cetak Laporan">
                   <div className="mb-8 bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex justify-between items-center print:hidden">
                      <div className="text-slate-500 font-bold text-sm">Pratinjau Laporan Peringkat Kelas Olimpiade</div>
                      <button onClick={() => window.print()} className="bg-primary hover:bg-primary-700 text-white px-6 py-3 rounded-xl font-black text-sm flex items-center shadow-lg transition-all"><i className="fas fa-print mr-2"></i> Cetak (A4)</button>
                   </div>
                   
                   <div className="bg-white border shadow-xl mx-auto w-full max-w-[21cm] min-h-[29.7cm] p-10 sm:p-16 print-container">
                      <div className="text-center border-b-4 border-slate-800 pb-6 mb-8">
                         <h1 className="text-2xl font-black uppercase tracking-widest text-slate-900 mb-2">Laporan Hasil Seleksi Olimpiade</h1>
                         <p className="text-slate-600 font-bold text-lg">{organizerName}</p>
                      </div>
                      
                      <table className="w-full text-left border-collapse text-sm">
                         <thead className="bg-slate-100 uppercase font-black text-xs text-slate-700 tracking-widest"><tr className="border-y-2 border-slate-800">
                            <th className="py-4 px-4 text-center w-16">Rank</th>
                            <th className="py-4 px-4">Nama Peserta</th>
                            <th className="py-4 px-4">Asal Sekolah</th>
                            <th className="py-4 px-4 text-center w-24">ITO</th>
                            <th className="py-4 px-4 text-center w-24">Skor</th>
                         </tr></thead>
                         <tbody>
                            {processedResults.map((r, i) => (
                               <tr key={i} className="border-b border-slate-200 font-bold">
                                  <td className="py-3 px-4 text-center text-slate-500">{i+1}</td>
                                  <td className="py-3 px-4 uppercase text-slate-900">{r.participant?.name}</td>
                                  <td className="py-3 px-4 text-slate-600">{r.participant?.school}</td>
                                  <td className="py-3 px-4 text-center text-primary">{r.detail?.summary?.ito || 0}</td>
                                  <td className="py-3 px-4 text-center text-success text-base">{r.score}</td>
                               </tr>
                            ))}
                         </tbody>
                      </table>
                      <div className="mt-20 flex justify-end text-center text-slate-800 font-bold text-sm"><div><p className="mb-24">Mengetahui,<br/>Koordinator Olimpiade</p><p className="font-black uppercase tracking-widest border-t-2 border-slate-800 pt-2 w-48 mx-auto">Administrator</p></div></div>
                   </div>
                </AdminLayout>
             );
          };

          switch (currentRoute) {
            case '/': case '/login': return <ParticipantLogin />;
            case '/instruction': return <ParticipantInstruction />;
            case '/exam': return <ExamEngine />;
            case '/review': return <ExamReview />;
            case '/dashboard': return <StudentDashboard />;
            case '/admin': case '/admin/login': return <AdminLogin />;
            case '/admin/dashboard': return <AdminDashboard />;
            case '/admin/tokens': return <AdminTokens />;
            case '/admin/results': return <AdminResults />;
            case '/admin/questions': return <AdminQuestions />;
            case '/admin/analysis': return <AdminItemAnalysis />;
            case '/admin/reports': return <AdminReports />;
            default: return <ParticipantLogin />;
          }
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
